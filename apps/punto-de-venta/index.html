<title>Mostrador</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: mostrador de tienda. Catálogo de botones a la izquierda, ticket de papel a la derecha; en teléfono se apilan con una barra de cobro abajo. */
:root {
  --bg: #eff1ed;
  --surface: #ffffff;
  --paper: #fffefa;
  --fg: #17201b;
  --muted: #5b6660;
  --line: #d8ddd5;
  --accent: #1d6b47;
  --accent-soft: #e2efe7;
  --accent-fg: #ffffff;
  --danger: #b23a2a;
  --warn: #8f6200;
  --f-display: "Bricolage Grotesque", "Avenir Next Condensed", "Arial Narrow", sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111513; --surface: #191f1c; --paper: #1f2622; --fg: #e6ebe7; --muted: #9aa69f; --line: #2e3732;
    --accent: #55c18c; --accent-soft: #1c3328; --accent-fg: #07140d; --danger: #ef806c; --warn: #e2b54c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111513; --surface: #191f1c; --paper: #1f2622; --fg: #e6ebe7; --muted: #9aa69f; --line: #2e3732;
  --accent: #55c18c; --accent-soft: #1c3328; --accent-fg: #07140d; --danger: #ef806c; --warn: #e2b54c;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--f-body); font-size: 15px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 96px;
}
.wrap { max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

/* Encabezado */
header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px 20px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.mark { width: 34px; height: 34px; border-radius: 8px; background: var(--accent); display: grid; place-items: center; color: var(--accent-fg); font: 700 18px var(--f-display); flex: none; }
.brand h1 { font-family: var(--f-display); font-weight: 700; font-size: 24px; margin: 0; line-height: 1.1; text-wrap: balance; }
.brand p { margin: 0; font-size: 12px; color: var(--muted); }
.tabs { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 4px; }
.tabs a { text-decoration: none; color: var(--muted); font-weight: 600; font-size: 14px; padding: 7px 14px; border-radius: 7px; white-space: nowrap; }
.tabs a:hover { color: var(--fg); }
.tabs a[aria-current="page"] { background: var(--fg); color: var(--bg); }
@media (max-width: 520px) { .tabs { width: 100%; } .tabs a { flex: 1; text-align: center; padding: 8px 6px; } }

.banner { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 9px 12px; font-size: 13px; color: var(--muted); }
.banner.warn { border-color: var(--warn); color: var(--warn); }

/* Controles */
input, select { font: inherit; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 7px; padding: 9px 10px; min-width: 0; width: 100%; }
input[type="number"] { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
@media (max-width: 600px) { input, select { font-size: 16px; } }
input:focus-visible, select:focus-visible, button:focus-visible, a:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
label.lbl { font-size: 12px; color: var(--muted); display: block; margin-bottom: 4px; }
.hint { font-size: 12px; color: var(--muted); margin: 4px 0 0; }
.btn { font: 600 14px var(--f-body); border-radius: 8px; padding: 9px 14px; cursor: pointer; border: 1px solid var(--line); background: var(--surface); color: var(--fg); white-space: nowrap; }
.btn:hover { border-color: var(--fg); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.primary:disabled { opacity: .5; cursor: not-allowed; filter: none; }
.btn.danger { color: var(--danger); }
.btn.danger.armed { background: var(--danger); border-color: var(--danger); color: var(--surface); }
.btn.sm { padding: 6px 10px; font-size: 13px; }
.link { background: none; border: 0; color: var(--muted); font: 500 13px var(--f-body); cursor: pointer; padding: 4px; text-decoration: underline; text-underline-offset: 3px; }
.link:hover { color: var(--danger); }
.chip { font: 500 11px var(--f-mono); padding: 1px 7px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.chip.ex { border-style: dashed; }
.chip.low { color: var(--warn); border-color: var(--warn); }
.chip.out { color: var(--danger); border-color: var(--danger); }
.chip.void { color: var(--danger); border-color: var(--danger); }
.err { color: var(--danger); font-size: 13px; margin: 0; }
.empty { border: 1px dashed var(--line); border-radius: 10px; padding: 28px 18px; text-align: center; color: var(--muted); grid-column: 1 / -1; }
.empty a { color: var(--accent); }

/* Vender */
.sell { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 20px; align-items: start; }
@media (max-width: 900px) { .sell { grid-template-columns: minmax(0, 1fr); } }
.catalog { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.search-row { display: flex; gap: 8px; }
.search-row input { flex: 1; }
.free { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr) minmax(0, .7fr) auto auto; gap: 8px; align-items: end; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
@media (max-width: 600px) { .free { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .free .fname { grid-column: 1 / -1; } }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chips button { font: 500 13px var(--f-body); border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 99px; padding: 5px 12px; cursor: pointer; }
.chips button[aria-pressed="true"] { background: var(--accent-soft); color: var(--fg); border-color: var(--accent); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
.tile { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px; cursor: pointer; color: var(--fg); display: flex; flex-direction: column; gap: 8px; min-height: 112px; font: inherit; position: relative; }
.tile:hover { border-color: var(--accent); }
.tile .nm { font-weight: 600; font-size: 14px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tile .pr { font: 600 18px var(--f-mono); font-variant-numeric: tabular-nums; margin-top: auto; }
.tile .meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.tile .qbadge { position: absolute; top: -7px; right: -7px; background: var(--accent); color: var(--accent-fg); font: 600 12px var(--f-mono); min-width: 24px; height: 24px; border-radius: 12px; display: grid; place-items: center; padding: 0 6px; }
.tile.dim { opacity: .55; }
@media (prefers-reduced-motion: no-preference) { .tile:active { transform: scale(.98); } .tile { transition: transform .08s, border-color .15s; } }

/* Ticket */
.ticket { position: sticky; top: calc(12px + env(safe-area-inset-top, 0px)); background: var(--paper); border: 1px solid var(--line); border-bottom: 0; border-radius: 10px 10px 0 0; padding: 16px 16px 18px; display: flex; flex-direction: column; gap: 14px; margin-bottom: 8px; }
.ticket::after { content: ""; position: absolute; left: -1px; right: -1px; bottom: -8px; height: 8px; background-image: linear-gradient(135deg, var(--paper) 50%, transparent 50%), linear-gradient(-135deg, var(--paper) 50%, transparent 50%); background-size: 12px 16px; }
@media (max-width: 900px) { .ticket { position: static; } }
.ticket-h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.ticket h2 { font-family: var(--f-display); font-weight: 700; font-size: 19px; margin: 0; }
.lines { display: flex; flex-direction: column; font-family: var(--f-mono); font-size: 13px; }
.line { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 10px; padding: 10px 0; border-bottom: 1px dashed var(--line); }
.line .ln-name { font-family: var(--f-body); font-weight: 500; font-size: 14px; min-width: 0; overflow-wrap: anywhere; }
.line .ln-name small { display: block; color: var(--muted); font-family: var(--f-mono); font-size: 12px; font-weight: 400; }
.line .ln-amt { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
.qty { display: flex; align-items: center; gap: 4px; }
.qty button { width: 30px; height: 30px; border-radius: 7px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); font: 600 16px var(--f-mono); cursor: pointer; }
.qty input { width: 64px; text-align: center; padding: 5px 4px; }
.line .x { justify-self: end; }
.lines .empty { padding: 20px 10px; font-family: var(--f-body); }
.tot { display: flex; flex-direction: column; gap: 6px; font-family: var(--f-mono); font-size: 14px; font-variant-numeric: tabular-nums; }
.r { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.r.big { font-size: 24px; font-weight: 600; border-top: 2px solid var(--fg); padding-top: 8px; margin-top: 4px; }
.r.big span:first-child { font-family: var(--f-display); font-size: 20px; }
.disc { display: flex; gap: 4px; width: 150px; }
.disc input { padding: 5px 7px; }
.disc select { width: 56px; padding: 5px 4px; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { background: var(--surface); border: 0; padding: 9px 4px; font: 600 13px var(--f-body); color: var(--muted); cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.pay { display: flex; flex-direction: column; gap: 10px; }
.quick { display: flex; gap: 6px; flex-wrap: wrap; }
.quick button { font: 500 13px var(--f-mono); border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 7px; padding: 5px 9px; cursor: pointer; }
.change { font-family: var(--f-mono); font-size: 16px; font-weight: 600; }
.change.short { color: var(--danger); }
.btn.charge { width: 100%; padding: 14px; font-size: 17px; border-radius: 10px; }

.done { display: flex; flex-direction: column; gap: 14px; }
.done .ok { font-family: var(--f-display); font-weight: 700; font-size: 22px; color: var(--accent); margin: 0; }
.bigchange { background: var(--accent-soft); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 2px; }
.bigchange span { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.bigchange b { font: 600 34px var(--f-mono); font-variant-numeric: tabular-nums; }
pre.receipt { font: 13px/1.5 var(--f-mono); white-space: pre-wrap; margin: 0; padding: 12px; border: 1px dashed var(--line); border-radius: 8px; overflow-x: auto; }
.done .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

.mbar { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); background: var(--surface); border-top: 1px solid var(--line); z-index: 20; }
.mbar button { width: 100%; display: flex; justify-content: space-between; }
@media (min-width: 901px) { .mbar { display: none; } }

/* Productos */
.prods { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 900px) { .prods { grid-template-columns: minmax(0, 1fr); } }
.col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.panel h2 { font-family: var(--f-display); font-weight: 700; font-size: 18px; margin: 0; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.list-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.plist { display: flex; flex-direction: column; }
.prow { display: grid; grid-template-columns: minmax(0, 1fr) auto auto auto; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.prow:last-child { border-bottom: 0; }
.prow .pn { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.prow .pn small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
.prow .pp { text-align: right; font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.prow .ps { text-align: right; }
.prow .pa { display: flex; gap: 6px; justify-content: flex-end; }
@media (max-width: 560px) {
  .prow { grid-template-columns: minmax(0, 1fr) auto; }
  .prow .pp { grid-row: 1; grid-column: 2; }
  .prow .ps { text-align: left; }
}

/* Ventas */
.sales { display: flex; flex-direction: column; gap: 16px; }
.sales-h { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; justify-content: space-between; }
.sales-h .day { display: flex; gap: 8px; align-items: end; }
.sales-h input { width: auto; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 700px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.stat span { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.stat b { font: 600 24px var(--f-mono); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.stat.main b { color: var(--accent); }
.split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
@media (max-width: 800px) { .split { grid-template-columns: minmax(0, 1fr); } }
.bars { display: flex; flex-direction: column; gap: 10px; }
.bar-r { display: grid; grid-template-columns: 7.5rem minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: 14px; }
.bar-r .track { height: 8px; background: var(--bg); border-radius: 4px; overflow: hidden; }
.bar-r .track i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
.bar-r .v { font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-size: 13px; }
.slist { display: flex; flex-direction: column; }
.sale { border-bottom: 1px solid var(--line); }
.sale:last-child { border-bottom: 0; }
.sale summary { list-style: none; display: grid; grid-template-columns: 3.4rem minmax(0, 1fr) auto auto; gap: 10px; align-items: center; padding: 11px 0; cursor: pointer; }
.sale summary::-webkit-details-marker { display: none; }
.sale .tm { font-family: var(--f-mono); color: var(--muted); font-size: 13px; }
.sale .sm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sale .st { font-family: var(--f-mono); font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }
.sale.voided .st, .sale.voided .sm { text-decoration: line-through; color: var(--muted); }
.sale .body { padding: 0 0 14px 3.4rem; display: flex; flex-direction: column; gap: 10px; }
@media (max-width: 560px) { .sale summary { grid-template-columns: 3rem minmax(0, 1fr) auto; } .sale summary .chip { display: none; } .sale .body { padding-left: 0; } }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(76px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 9px 16px; border-radius: 8px; font-size: 14px; z-index: 30; max-width: calc(100% - 32px); }
@media (min-width: 901px) { .toast { bottom: calc(24px + env(safe-area-inset-bottom, 0px)); } }
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="mark" aria-hidden="true">$</div>
      <div><h1 id="storeTitle">Mostrador</h1><p id="todayLine"></p></div>
    </div>
    <nav class="tabs" aria-label="Secciones">
      <a href="#vender" data-view="vender">Vender</a>
      <a href="#productos" data-view="productos">Productos</a>
      <a href="#ventas" data-view="ventas">Ventas</a>
    </nav>
  </header>
  <div id="banner" class="banner" hidden></div>

  <!-- VENDER -->
  <section id="v-vender" class="view sell">
    <div class="catalog">
      <div class="search-row">
        <input id="q" type="search" placeholder="Buscar por nombre o código (Enter agrega)" aria-label="Buscar producto" autocomplete="off">
        <button type="button" class="btn" id="freeBtn">+ Artículo libre</button>
      </div>
      <form id="freeForm" class="free" hidden autocomplete="off">
        <div class="fname"><label class="lbl" for="fName">Concepto</label><input id="fName" type="text" placeholder="Ej. Corte especial" required></div>
        <div><label class="lbl" for="fPrice">Precio</label><input id="fPrice" type="number" inputmode="decimal" step="any" min="0" required></div>
        <div><label class="lbl" for="fQty">Cant.</label><input id="fQty" type="number" inputmode="decimal" step="any" min="0" value="1"></div>
        <button type="submit" class="btn primary">Agregar</button>
        <button type="button" class="btn" id="freeCancel">Cerrar</button>
      </form>
      <div id="cats" class="chips" role="group" aria-label="Categorías"></div>
      <div id="grid" class="grid"></div>
    </div>

    <aside class="ticket" id="ticket" aria-label="Venta actual">
      <div id="cartMode" style="display:contents">
        <div class="ticket-h"><h2>Venta actual</h2><button type="button" class="link" id="clearCart">Vaciar</button></div>
        <div id="lines" class="lines"></div>
        <div class="tot">
          <div class="r"><span>Subtotal</span><span id="tSub">$0.00</span></div>
          <div class="r"><label for="disc">Descuento</label>
            <div class="disc"><input id="disc" type="number" inputmode="decimal" step="any" min="0" placeholder="0"><select id="discType" aria-label="Tipo de descuento"><option value="amt">$</option><option value="pct">%</option></select></div>
          </div>
          <div class="r big"><span>Total</span><span id="tTot">$0.00</span></div>
        </div>
        <div class="pay">
          <div class="seg" id="method" role="group" aria-label="Forma de pago">
            <button type="button" data-m="efectivo" aria-pressed="true">Efectivo</button>
            <button type="button" data-m="tarjeta" aria-pressed="false">Tarjeta</button>
            <button type="button" data-m="transferencia" aria-pressed="false">Transferencia</button>
          </div>
          <div id="cashBox" class="pay">
            <div><label class="lbl" for="recv">Recibido</label><input id="recv" type="number" inputmode="decimal" step="any" min="0" placeholder="Exacto"></div>
            <div class="quick" id="quick"></div>
            <div class="r"><span>Cambio</span><span id="tChange" class="change">—</span></div>
          </div>
          <p id="payErr" class="err" hidden></p>
          <button type="button" class="btn primary charge" id="charge">Cobrar</button>
        </div>
      </div>
      <div id="doneMode" class="done" hidden></div>
    </aside>
  </section>

  <!-- PRODUCTOS -->
  <section id="v-productos" class="view prods" hidden>
    <div class="col">
      <form id="pform" class="panel" autocomplete="off">
        <h2 id="pformTitle">Nuevo producto</h2>
        <div><label class="lbl" for="pName">Nombre</label><input id="pName" type="text" required placeholder="Ej. Triplay 18 mm"></div>
        <div class="two">
          <div><label class="lbl" for="pPrice">Precio</label><input id="pPrice" type="number" inputmode="decimal" step="any" min="0" required></div>
          <div><label class="lbl" for="pStock">Existencia</label><input id="pStock" type="number" inputmode="decimal" step="any" placeholder="Sin control"></div>
        </div>
        <div class="two">
          <div><label class="lbl" for="pCat">Categoría</label><input id="pCat" type="text" list="catList" placeholder="General"></div>
          <div><label class="lbl" for="pCode">Código</label><input id="pCode" type="text" placeholder="Opcional"></div>
        </div>
        <datalist id="catList"></datalist>
        <p class="hint">Deja la existencia vacía si no quieres llevar inventario de ese producto. Cada venta la descuenta sola.</p>
        <p id="pErr" class="err" hidden></p>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button type="submit" class="btn primary" id="pSave">Guardar producto</button>
          <button type="button" class="btn" id="pCancel" hidden>Cancelar</button>
        </div>
      </form>
      <form id="sform" class="panel" autocomplete="off">
        <h2>Tu negocio</h2>
        <div><label class="lbl" for="sName">Nombre que sale en el ticket</label><input id="sName" type="text" placeholder="Ej. Maderas Don Luis"></div>
        <div><label class="lbl" for="sFoot">Mensaje al final del ticket</label><input id="sFoot" type="text" placeholder="¡Gracias por su compra!"></div>
        <div><button type="submit" class="btn">Guardar</button></div>
      </form>
    </div>
    <div class="panel">
      <div class="list-h"><h2>Catálogo <span class="chip" id="pcount">0</span></h2><button type="button" class="btn sm danger" id="delEx" hidden>Borrar ejemplos</button></div>
      <div id="plist" class="plist"></div>
    </div>
  </section>

  <!-- VENTAS -->
  <section id="v-ventas" class="view sales" hidden>
    <div class="sales-h">
      <div class="day">
        <div><label class="lbl" for="day">Día</label><input id="day" type="date"></div>
        <button type="button" class="btn" id="todayBtn">Hoy</button>
      </div>
      <button type="button" class="btn primary" id="copyCut">Copiar corte de caja</button>
    </div>
    <div id="sstats" class="stats"></div>
    <div class="split">
      <div class="panel"><h2>Por forma de pago</h2><div id="byMethod" class="bars"></div></div>
      <div class="panel"><h2>Lo más vendido</h2><div id="topList" class="bars"></div></div>
    </div>
    <div class="panel"><h2>Ventas del día</h2><div id="slist" class="slist"></div></div>
  </section>
</div>

<div class="mbar" id="mbar" hidden><button type="button" class="btn primary" id="mbarBtn"><span id="mbarL">Ver venta</span><span id="mbarR" class="num"></span></button></div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const $$ = (s) => [...document.querySelectorAll(s)];
  const money = new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN' });
  const M = (n) => money.format(+n || 0);
  const r2 = (n) => Math.round((+n || 0) * 100) / 100;
  const r3 = (n) => Math.round((+n || 0) * 1000) / 1000;
  const num = (v) => { const n = parseFloat(v); return Number.isFinite(n) ? n : 0; };
  const fq = (n) => String(r3(n));
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const pad = (n) => String(n).padStart(2, '0');
  const dayOf = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const timeOf = (iso) => { const d = new Date(iso); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const METHODS = { efectivo: 'Efectivo', tarjeta: 'Tarjeta', transferencia: 'Transferencia' };
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  /* ---------- Estado ---------- */
  const S = {
    mode: 'loading', loaded: false, slow: false, loadErr: false, readOnly: false,
    products: [], sales: [], salesLoaded: false, settings: {},
    localSales: [], day: dayOf(new Date()), cat: 'Todas', method: 'efectivo', view: 'vender', editing: null,
  };
  let db = null, unsubSales = null;

  // borrador de la venta actual: solo en este navegador
  const DKEY = 'mostrador-borrador-v1', LKEY = 'mostrador-local-v1';
  let cart = [];
  try { const d = JSON.parse(localStorage.getItem(DKEY)); if (Array.isArray(d)) cart = d; } catch (e) {}
  const saveDraft = () => { try { localStorage.setItem(DKEY, JSON.stringify(cart)); } catch (e) {} };

  /* ---------- Almacenamiento ---------- */
  function localSave() {
    try { localStorage.setItem(LKEY, JSON.stringify({ products: S.products, sales: S.localSales, settings: S.settings })); } catch (e) {}
  }
  function localFilterSales() { S.sales = S.localSales.filter((s) => s.day === S.day).sort((a, b) => b.at.localeCompare(a.at)); S.salesLoaded = true; }

  const api = {
    async saveProduct(p) {
      const id = p.id || uid(); const body = { ...p }; delete body.id;
      if (db) return db.collection('products').doc(id).set(body);
      const i = S.products.findIndex((x) => x.id === id);
      if (i < 0) S.products.push({ id, ...body }); else S.products[i] = { id, ...body };
      localSave(); onProducts();
    },
    async deleteProduct(id) {
      if (db) return db.doc('products/' + id).delete();
      S.products = S.products.filter((x) => x.id !== id); localSave(); onProducts();
    },
    async patchProduct(id, patch) {
      if (db) return db.doc('products/' + id).update(patch);
      const p = S.products.find((x) => x.id === id); if (p) Object.assign(p, patch); localSave(); onProducts();
    },
    async addSale(sale) {
      const body = { ...sale }; delete body.id;
      if (db) return db.collection('sales').doc(sale.id).set(body);
      S.localSales.push(sale); localSave(); localFilterSales(); onSales();
    },
    async patchSale(id, patch) {
      if (db) return db.doc('sales/' + id).update(patch);
      const s = S.localSales.find((x) => x.id === id); if (s) Object.assign(s, patch); localSave(); localFilterSales(); onSales();
    },
    async saveSettings(s) {
      if (db) return db.doc('settings/store').set(s);
      S.settings = s; localSave(); onSettings();
    },
  };

  async function guard(fn) {
    for (let attempt = 0; attempt < 2; attempt++) {
      try { await fn(); return true; } catch (e) {
        const code = e && e.code;
        if (code === 'unavailable' && attempt === 0) { await sleep(400 + Math.random() * 800); continue; }
        if (code === 'invalid_argument' || code === 'not_granted') { setReadOnly(true); toast('No tienes permiso para guardar en esta página.'); }
        else if (code === 'quota_exceeded') toast('Se llenó el espacio de datos. Borra productos o ventas viejas.');
        else if (code === 'revoked') toast('Perdiste el acceso a los datos. Recarga la página.');
        else toast('No se pudo guardar. Revisa tu conexión e intenta de nuevo.');
        return false;
      }
    }
    return false;
  }

  function setReadOnly(v) { S.readOnly = v; renderBanner(); renderAccess(); }

  /* ---------- Arranque ---------- */
  async function init() {
    $('#todayLine').textContent = new Date().toLocaleDateString('es-MX', { weekday: 'long', day: 'numeric', month: 'long' });
    $('#day').value = S.day;
    route(); renderCart(); renderBanner(); onProducts(); onSales();

    let cap = null;
    if (window.claude && typeof window.claude.use === 'function') {
      try { cap = await window.claude.use('db'); } catch (e) { cap = null; }
    }
    if (cap) {
      db = cap; S.mode = 'db'; renderBanner(); startDb();
      try {
        const u = await window.claude.use('user');
        if (u) { const c = await u.can('data.write'); if (c === false) setReadOnly(true); }
      } catch (e) {}
    } else {
      S.mode = 'local';
      let L = {}; try { L = JSON.parse(localStorage.getItem(LKEY)) || {}; } catch (e) {}
      S.products = Array.isArray(L.products) ? L.products : [];
      S.localSales = Array.isArray(L.sales) ? L.sales : [];
      S.settings = L.settings || {};
      S.loaded = true; localFilterSales();
      renderBanner(); onProducts(); onSettings(); onSales();
    }
  }

  function startDb() {
    const timer = setTimeout(() => { if (!S.loaded) { S.slow = true; renderBanner(); } }, 10000);
    db.collection('products').onSnapshot((snap) => {
      S.products = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      if (!snap.metadata.fromCache) { S.loaded = true; S.slow = false; clearTimeout(timer); }
      else if (snap.size) S.loaded = true;
      renderBanner(); onProducts();
    }, () => { clearTimeout(timer); S.loaded = true; S.loadErr = true; renderBanner(); onProducts(); });
    db.doc('settings/store').onSnapshot((d) => { S.settings = d.exists ? { ...d.data() } : {}; onSettings(); }, () => {});
    subscribeSales();
  }

  function subscribeSales() {
    if (S.mode === 'local') { localFilterSales(); onSales(); return; }
    if (!db) return;
    if (unsubSales) unsubSales();
    S.sales = []; S.salesLoaded = false; onSales();
    unsubSales = db.collection('sales').where('day', '==', S.day).onSnapshot((snap) => {
      S.sales = snap.docs.map((d) => ({ id: d.id, ...d.data() })).sort((a, b) => String(b.at).localeCompare(String(a.at)));
      S.salesLoaded = true; onSales();
    }, () => { S.salesLoaded = true; onSales(); toast('No se pudieron cargar las ventas.'); });
  }

  function renderBanner() {
    const b = $('#banner'); let msg = '', warn = false;
    if (S.mode === 'loading') msg = 'Conectando con tus datos…';
    else if (S.mode === 'local') msg = 'Modo local: tus productos y ventas se guardan solo en este navegador. Abre la página con tu cuenta para guardarlos en la nube.';
    if (S.slow) { msg = 'Todavía no se pudo conectar con tus datos. Sigo intentando; lo que ves puede estar desactualizado.'; warn = true; }
    if (S.loadErr) { msg = 'No se pudo cargar el catálogo. Recarga la página.'; warn = true; }
    if (S.readOnly) { msg = 'Solo lectura: puedes ver el catálogo y las ventas, pero no cobrar ni editar.'; warn = true; }
    b.textContent = msg; b.hidden = !msg; b.classList.toggle('warn', warn);
  }

  function renderAccess() {
    $('#charge').disabled = S.readOnly || !cart.length;
    $('#pform').hidden = S.readOnly; $('#sform').hidden = S.readOnly;
    $('#delEx').hidden = S.readOnly || !S.products.some((p) => p.example);
  }

  /* ---------- Rutas ---------- */
  const VIEWS = ['vender', 'productos', 'ventas'];
  function route() {
    const h = location.hash.slice(1);
    S.view = VIEWS.includes(h) ? h : 'vender';
    VIEWS.forEach((v) => { $('#v-' + v).hidden = v !== S.view; });
    $$('.tabs a').forEach((a) => { if (a.dataset.view === S.view) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
    updateMbar();
  }
  window.addEventListener('hashchange', route);

  /* ---------- Catálogo ---------- */
  const sortedProducts = () => S.products.slice().sort((a, b) => String(a.category || '').localeCompare(String(b.category || ''), 'es') || String(a.name).localeCompare(String(b.name), 'es'));
  const categories = () => [...new Set(S.products.map((p) => (p.category || 'General').trim() || 'General'))].sort((a, b) => a.localeCompare(b, 'es'));
  const norm = (s) => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');

  function onProducts() { renderCats(); renderGrid(); renderPList(); renderAccess(); }

  function renderCats() {
    const cats = categories();
    if (S.cat !== 'Todas' && !cats.includes(S.cat)) S.cat = 'Todas';
    $('#cats').innerHTML = cats.length > 1 ? ['Todas', ...cats].map((c) => `<button type="button" data-cat="${esc(c)}" aria-pressed="${c === S.cat}">${esc(c)}</button>`).join('') : '';
    $('#catList').innerHTML = cats.map((c) => `<option value="${esc(c)}"></option>`).join('');
  }

  function filtered() {
    const q = norm($('#q').value.trim());
    return sortedProducts().filter((p) => {
      if (S.cat !== 'Todas' && ((p.category || 'General').trim() || 'General') !== S.cat) return false;
      if (!q) return true;
      return norm(p.name).includes(q) || norm(p.code).includes(q);
    });
  }

  function stockChip(p) {
    if (typeof p.stock !== 'number') return '';
    if (p.stock <= 0) return `<span class="chip out">Agotado</span>`;
    if (p.stock <= 3) return `<span class="chip low">Quedan ${fq(p.stock)}</span>`;
    return `<span class="chip">${fq(p.stock)} en existencia</span>`;
  }

  function renderGrid() {
    const g = $('#grid');
    if (!S.loaded) { g.innerHTML = `<div class="empty">Cargando tu catálogo…</div>`; return; }
    if (!S.products.length) {
      g.innerHTML = `<div class="empty">Aún no tienes productos. ${S.readOnly ? '' : 'Agrega el primero en <a href="#productos">Productos</a>, o usa <b>+ Artículo libre</b> para cobrar algo ahora mismo.'}</div>`;
      return;
    }
    const list = filtered();
    if (!list.length) { g.innerHTML = `<div class="empty">Nada coincide con «${esc($('#q').value)}».</div>`; return; }
    const inCart = new Map(cart.filter((l) => l.pid).map((l) => [l.pid, l.qty]));
    g.innerHTML = list.map((p) => {
      const q = inCart.get(p.id);
      const out = typeof p.stock === 'number' && p.stock <= 0;
      return `<button type="button" class="tile${out ? ' dim' : ''}" data-pid="${esc(p.id)}">
        ${q ? `<span class="qbadge">${fq(q)}</span>` : ''}
        <span class="nm">${esc(p.name)}</span>
        <span class="meta">${p.example ? '<span class="chip ex">ejemplo</span>' : ''}${stockChip(p)}</span>
        <span class="pr">${M(p.price)}</span>
      </button>`;
    }).join('');
  }

  $('#cats').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; S.cat = b.dataset.cat; renderCats(); renderGrid(); });
  $('#q').addEventListener('input', renderGrid);
  $('#q').addEventListener('keydown', (e) => {
    if (e.key !== 'Enter') return;
    e.preventDefault();
    const v = norm($('#q').value.trim()); if (!v) return;
    const exact = S.products.find((p) => p.code && norm(p.code) === v);
    const p = exact || filtered()[0];
    if (p) { addProduct(p); $('#q').value = ''; renderGrid(); }
  });
  $('#grid').addEventListener('click', (e) => {
    const t = e.target.closest('.tile'); if (!t) return;
    const p = S.products.find((x) => x.id === t.dataset.pid); if (p) addProduct(p);
  });

  // artículo libre
  $('#freeBtn').addEventListener('click', () => { const f = $('#freeForm'); f.hidden = !f.hidden; if (!f.hidden) $('#fName').focus(); });
  $('#freeCancel').addEventListener('click', () => { $('#freeForm').hidden = true; });
  $('#freeForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const name = $('#fName').value.trim(), price = r2(num($('#fPrice').value)), qty = r3(num($('#fQty').value) || 1);
    if (!name || price < 0) return;
    cart.push({ key: uid(), pid: null, name, price, qty });
    $('#fName').value = ''; $('#fPrice').value = ''; $('#fQty').value = '1';
    cartChanged(); toast(`${name} agregado`); $('#fName').focus();
  });

  /* ---------- Venta actual ---------- */
  function addProduct(p) {
    const line = cart.find((l) => l.pid === p.id);
    const have = line ? line.qty : 0;
    if (typeof p.stock === 'number' && have + 1 > p.stock + 1e-9) {
      toast(p.stock <= 0 ? `${p.name} está agotado.` : `Solo hay ${fq(p.stock)} de ${p.name}.`); return;
    }
    if (line) line.qty = r3(line.qty + 1);
    else cart.push({ key: uid(), pid: p.id, name: p.name, price: r2(p.price), qty: 1 });
    cartChanged();
  }

  function cartChanged() { saveDraft(); renderCart(); renderGrid(); }

  function renderCart() {
    const L = $('#lines');
    if (!cart.length) {
      L.innerHTML = `<div class="empty">Toca un producto para agregarlo a la venta.</div>`;
    } else {
      L.innerHTML = cart.map((l) => `<div class="line" data-key="${l.key}">
        <div class="ln-name">${esc(l.name)}<small>${M(l.price)} c/u</small></div>
        <div class="ln-amt" data-amt>${M(l.price * l.qty)}</div>
        <div class="qty">
          <button type="button" data-a="dec" aria-label="Uno menos de ${esc(l.name)}">−</button>
          <input type="number" inputmode="decimal" step="any" min="0" data-a="qty" id="qty-${l.key}" value="${fq(l.qty)}" aria-label="Cantidad de ${esc(l.name)}">
          <button type="button" data-a="inc" aria-label="Uno más de ${esc(l.name)}">+</button>
        </div>
        <button type="button" class="link x" data-a="rm">Quitar</button>
      </div>`).join('');
    }
    $('#clearCart').hidden = !cart.length;
    renderTotals(); renderAccess(); updateMbar();
  }

  function totals() {
    const sub = r2(cart.reduce((s, l) => s + l.price * l.qty, 0));
    const dv = Math.max(0, num($('#disc').value));
    const disc = r2(Math.min(sub, $('#discType').value === 'pct' ? sub * Math.min(dv, 100) / 100 : dv));
    return { sub, disc, total: r2(sub - disc) };
  }

  function renderTotals() {
    const t = totals();
    $('#tSub').textContent = M(t.sub);
    $('#tTot').textContent = M(t.total);
    $('#cashBox').hidden = S.method !== 'efectivo';
    const rv = $('#recv').value.trim();
    const ch = $('#tChange');
    if (rv === '') { ch.textContent = t.total ? 'Pago exacto' : '—'; ch.classList.remove('short'); }
    else {
      const d = r2(num(rv) - t.total);
      ch.textContent = d >= 0 ? M(d) : `Faltan ${M(-d)}`;
      ch.classList.toggle('short', d < 0);
    }
    // billetes rápidos
    const opts = new Set();
    if (t.total > 0) {
      [50, 100, 200, 500, 1000].forEach((b) => { const v = Math.ceil(t.total / b) * b; if (v > t.total) opts.add(v); });
    }
    $('#quick').innerHTML = [...opts].sort((a, b) => a - b).slice(0, 4).map((v) => `<button type="button" data-v="${v}">${M(v)}</button>`).join('');
    $('#payErr').hidden = true;
    updateMbar();
  }

  $('#lines').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-a]'); if (!b) return;
    const key = b.closest('.line').dataset.key;
    const l = cart.find((x) => x.key === key); if (!l) return;
    const a = b.dataset.a;
    if (a === 'rm') cart = cart.filter((x) => x !== l);
    else if (a === 'dec') { l.qty = r3(l.qty - 1); if (l.qty <= 0) cart = cart.filter((x) => x !== l); }
    else if (a === 'inc') {
      const p = l.pid && S.products.find((x) => x.id === l.pid);
      if (p && typeof p.stock === 'number' && l.qty + 1 > p.stock + 1e-9) { toast(`Solo hay ${fq(p.stock)} de ${p.name}.`); return; }
      l.qty = r3(l.qty + 1);
    }
    cartChanged();
  });
  $('#lines').addEventListener('input', (e) => {
    if (e.target.dataset.a !== 'qty') return;
    const row = e.target.closest('.line');
    const l = cart.find((x) => x.key === row.dataset.key); if (!l) return;
    l.qty = Math.max(0, r3(num(e.target.value)));
    row.querySelector('[data-amt]').textContent = M(l.price * l.qty);
    saveDraft(); renderTotals();
  });
  $('#lines').addEventListener('change', (e) => {
    if (e.target.dataset.a !== 'qty') return;
    cart = cart.filter((x) => x.qty > 0);
    cartChanged();
  });

  let clearArmed = null;
  $('#clearCart').addEventListener('click', (e) => {
    if (!clearArmed) {
      e.target.textContent = '¿Vaciar la venta?';
      clearArmed = setTimeout(() => { clearArmed = null; e.target.textContent = 'Vaciar'; }, 3000);
      return;
    }
    clearTimeout(clearArmed); clearArmed = null; e.target.textContent = 'Vaciar';
    cart = []; $('#disc').value = ''; $('#recv').value = ''; cartChanged();
  });

  $('#disc').addEventListener('input', renderTotals);
  $('#discType').addEventListener('change', renderTotals);
  $('#recv').addEventListener('input', renderTotals);
  $('#quick').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; $('#recv').value = b.dataset.v; renderTotals(); });
  $('#method').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    S.method = b.dataset.m;
    $$('#method button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
    renderTotals();
  });

  function payErr(msg) { const p = $('#payErr'); p.textContent = msg; p.hidden = false; }

  $('#charge').addEventListener('click', async () => {
    if (S.readOnly) return;
    if (!cart.length) return payErr('Agrega al menos un producto.');
    const t = totals();
    let received = t.total, change = 0;
    if (S.method === 'efectivo') {
      const rv = $('#recv').value.trim();
      received = rv === '' ? t.total : r2(num(rv));
      if (received + 0.001 < t.total) return payErr(`Faltan ${M(t.total - received)} para completar el pago.`);
      change = r2(received - t.total);
    }
    const btn = $('#charge'); btn.disabled = true; btn.textContent = 'Guardando…';
    const now = new Date();
    const sale = {
      id: `${dayOf(now).replace(/-/g, '')}-${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}-${Math.random().toString(36).slice(2, 5)}`,
      at: now.toISOString(), day: dayOf(now),
      items: cart.map(({ pid, name, price, qty }) => ({ pid: pid || null, name, price, qty })),
      subtotal: t.sub, discount: t.disc, total: t.total,
      method: S.method, received, change, voided: false,
    };
    const ok = await guard(() => api.addSale(sale));
    btn.textContent = 'Cobrar';
    if (!ok) { renderAccess(); return; }
    await adjustStock(sale.items, -1);
    cart = []; saveDraft();
    $('#disc').value = ''; $('#recv').value = '';
    showDone(sale);
    renderCart(); renderGrid();
  });

  async function adjustStock(items, sign) {
    for (const it of items) {
      if (!it.pid) continue;
      const p = S.products.find((x) => x.id === it.pid);
      if (p && typeof p.stock === 'number') {
        const stock = r3(p.stock + sign * it.qty);
        await guard(() => api.patchProduct(p.id, { stock }));
        p.stock = stock;
      }
    }
  }

  const folio = (s) => s.id.split('-').slice(1).join('-').toUpperCase();

  function ticketText(s) {
    const W = 34;
    const row = (l, r) => { l = String(l); r = String(r); const sp = Math.max(1, W - l.length - r.length); return l + ' '.repeat(sp) + r; };
    const d = new Date(s.at);
    const out = [];
    out.push((S.settings.name || 'Mi negocio').toUpperCase());
    out.push(`${d.toLocaleDateString('es-MX')} ${timeOf(s.at)}  Folio ${folio(s)}`);
    out.push('-'.repeat(W));
    s.items.forEach((it) => {
      out.push(it.name.length > W ? it.name.slice(0, W) : it.name);
      out.push(row(`  ${fq(it.qty)} x ${M(it.price)}`, M(it.price * it.qty)));
    });
    out.push('-'.repeat(W));
    if (s.discount) { out.push(row('Subtotal', M(s.subtotal))); out.push(row('Descuento', '-' + M(s.discount))); }
    out.push(row('TOTAL', M(s.total)));
    out.push(row('Pago', METHODS[s.method] || s.method));
    if (s.method === 'efectivo') { out.push(row('Recibido', M(s.received))); out.push(row('Cambio', M(s.change))); }
    out.push('');
    out.push(S.settings.footer || '¡Gracias por su compra!');
    return out.join('\n');
  }

  let lastSale = null;
  function showDone(sale) {
    lastSale = sale;
    $('#cartMode').hidden = true; $('#cartMode').style.display = 'none';
    const d = $('#doneMode'); d.hidden = false;
    d.innerHTML = `<p class="ok">Venta registrada</p>
      ${sale.method === 'efectivo' ? `<div class="bigchange"><span>Cambio a entregar</span><b>${M(sale.change)}</b></div>` : `<div class="bigchange"><span>Cobrado con ${METHODS[sale.method].toLowerCase()}</span><b>${M(sale.total)}</b></div>`}
      <pre class="receipt">${esc(ticketText(sale))}</pre>
      <div class="btns"><button type="button" class="btn" id="copyTicket">Copiar ticket</button><button type="button" class="btn primary" id="newSale">Nueva venta</button></div>`;
    $('#copyTicket').addEventListener('click', () => copy(ticketText(sale), 'Ticket copiado'));
    $('#newSale').addEventListener('click', newSale);
    $('#newSale').focus();
    updateMbar();
    if (window.matchMedia('(max-width: 900px)').matches) $('#ticket').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
  function newSale() {
    lastSale = null;
    $('#doneMode').hidden = true; $('#cartMode').hidden = false; $('#cartMode').style.display = 'contents';
    updateMbar(); $('#q').focus();
  }

  function updateMbar() {
    const show = S.view === 'vender' && cart.length > 0 && !lastSale;
    $('#mbar').hidden = !show;
    if (show) {
      const n = cart.reduce((s, l) => s + l.qty, 0);
      $('#mbarL').textContent = `Ver venta · ${fq(n)} ${n === 1 ? 'artículo' : 'artículos'}`;
      $('#mbarR').textContent = M(totals().total);
    }
  }
  $('#mbarBtn').addEventListener('click', () => $('#ticket').scrollIntoView({ behavior: 'smooth', block: 'start' }));

  /* ---------- Productos ---------- */
  function renderPList() {
    const list = sortedProducts();
    $('#pcount').textContent = list.length;
    const el = $('#plist');
    if (!S.loaded) { el.innerHTML = `<div class="empty">Cargando…</div>`; return; }
    if (!list.length) { el.innerHTML = `<div class="empty">Tu catálogo está vacío. Escribe el primer producto en el formulario.</div>`; return; }
    el.innerHTML = list.map((p) => `<div class="prow" data-id="${esc(p.id)}">
      <div class="pn">${esc(p.name)} ${p.example ? '<span class="chip ex">ejemplo</span>' : ''}<small>${esc((p.category || 'General'))}${p.code ? ' · ' + esc(p.code) : ''}</small></div>
      <div class="pp">${M(p.price)}</div>
      <div class="ps">${typeof p.stock === 'number' ? stockChip(p) : '<span class="chip">Sin control</span>'}</div>
      <div class="pa">${S.readOnly ? '' : `<button type="button" class="btn sm" data-a="edit">Editar</button><button type="button" class="btn sm danger" data-a="del">Borrar</button>`}</div>
    </div>`).join('');
  }

  function fillForm(p) {
    S.editing = p ? p.id : null;
    $('#pformTitle').textContent = p ? 'Editar producto' : 'Nuevo producto';
    $('#pSave').textContent = p ? 'Guardar cambios' : 'Guardar producto';
    $('#pCancel').hidden = !p;
    $('#pName').value = p ? p.name : '';
    $('#pPrice').value = p ? p.price : '';
    $('#pStock').value = p && typeof p.stock === 'number' ? p.stock : '';
    $('#pCat').value = p ? (p.category || '') : '';
    $('#pCode').value = p ? (p.code || '') : '';
    $('#pErr').hidden = true;
  }

  $('#plist').addEventListener('click', async (e) => {
    const b = e.target.closest('button[data-a]'); if (!b) return;
    const id = b.closest('.prow').dataset.id;
    const p = S.products.find((x) => x.id === id); if (!p) return;
    if (b.dataset.a === 'edit') { fillForm(p); $('#pName').focus(); $('#pform').scrollIntoView({ behavior: 'smooth', block: 'nearest' }); return; }
    if (!b.classList.contains('armed')) {
      b.classList.add('armed'); b.textContent = '¿Seguro?';
      setTimeout(() => { if (b.isConnected) { b.classList.remove('armed'); b.textContent = 'Borrar'; } }, 3000);
      return;
    }
    if (await guard(() => api.deleteProduct(id))) { toast(`${p.name} borrado`); if (S.editing === id) fillForm(null); }
  });

  $('#pCancel').addEventListener('click', () => fillForm(null));
  $('#pform').addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = $('#pName').value.trim();
    const priceRaw = $('#pPrice').value.trim();
    const stockRaw = $('#pStock').value.trim();
    if (!name) { $('#pErr').textContent = 'Escribe el nombre del producto.'; $('#pErr').hidden = false; return; }
    if (priceRaw === '' || num(priceRaw) < 0) { $('#pErr').textContent = 'Escribe un precio de 0 o más.'; $('#pErr').hidden = false; return; }
    const prev = S.editing && S.products.find((x) => x.id === S.editing);
    const p = {
      id: S.editing || undefined, name, price: r2(num(priceRaw)),
      stock: stockRaw === '' ? null : r3(num(stockRaw)),
      category: $('#pCat').value.trim() || 'General', code: $('#pCode').value.trim(),
      createdAt: prev && prev.createdAt ? prev.createdAt : new Date().toISOString(),
    };
    const btn = $('#pSave'); btn.disabled = true;
    const ok = await guard(() => api.saveProduct(p));
    btn.disabled = false;
    if (ok) { toast(S.editing ? 'Cambios guardados' : `${name} agregado al catálogo`); fillForm(null); $('#pName').focus(); }
  });

  let exArmed = null;
  $('#delEx').addEventListener('click', async (e) => {
    const b = e.target;
    if (!exArmed) {
      b.classList.add('armed'); b.textContent = '¿Borrar todos los ejemplos?';
      exArmed = setTimeout(() => { exArmed = null; b.classList.remove('armed'); b.textContent = 'Borrar ejemplos'; }, 3000);
      return;
    }
    clearTimeout(exArmed); exArmed = null; b.classList.remove('armed'); b.textContent = 'Borrar ejemplos';
    const ex = S.products.filter((p) => p.example);
    for (const p of ex) { if (!(await guard(() => api.deleteProduct(p.id)))) break; }
    cart = cart.filter((l) => !ex.some((p) => p.id === l.pid)); cartChanged();
    toast('Ejemplos borrados');
  });

  function onSettings() {
    const name = S.settings.name || '';
    $('#storeTitle').textContent = name || 'Mostrador';
    if (document.activeElement !== $('#sName')) $('#sName').value = name;
    if (document.activeElement !== $('#sFoot')) $('#sFoot').value = S.settings.footer || '';
  }
  $('#sform').addEventListener('submit', async (e) => {
    e.preventDefault();
    const s = { name: $('#sName').value.trim(), footer: $('#sFoot').value.trim() };
    if (await guard(() => api.saveSettings(s))) toast('Datos del negocio guardados');
  });

  /* ---------- Ventas ---------- */
  function onSales() {
    const valid = S.sales.filter((s) => !s.voided);
    const total = r2(valid.reduce((a, s) => a + s.total, 0));
    const count = valid.length;
    const items = valid.reduce((a, s) => a + s.items.reduce((b, i) => b + i.qty, 0), 0);
    $('#sstats').innerHTML = `
      <div class="stat main"><span>Vendido</span><b>${M(total)}</b></div>
      <div class="stat"><span>Ventas</span><b>${count}</b></div>
      <div class="stat"><span>Ticket promedio</span><b>${M(count ? total / count : 0)}</b></div>
      <div class="stat"><span>Artículos</span><b>${fq(items)}</b></div>`;

    const by = { efectivo: 0, tarjeta: 0, transferencia: 0 };
    valid.forEach((s) => { by[s.method] = r2((by[s.method] || 0) + s.total); });
    const maxM = Math.max(1, ...Object.values(by));
    $('#byMethod').innerHTML = Object.keys(METHODS).map((k) => `<div class="bar-r"><span>${METHODS[k]}</span><div class="track"><i style="width:${(by[k] / maxM * 100).toFixed(1)}%"></i></div><span class="v">${M(by[k])}</span></div>`).join('');

    const tops = new Map();
    valid.forEach((s) => s.items.forEach((i) => { const t = tops.get(i.name) || { qty: 0, amt: 0 }; t.qty += i.qty; t.amt += i.price * i.qty; tops.set(i.name, t); }));
    const top = [...tops.entries()].sort((a, b) => b[1].amt - a[1].amt).slice(0, 5);
    const maxT = Math.max(1, ...top.map((t) => t[1].amt));
    $('#topList').innerHTML = top.length ? top.map(([n, t]) => `<div class="bar-r"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(n)}">${esc(n)}</span><div class="track"><i style="width:${(t.amt / maxT * 100).toFixed(1)}%"></i></div><span class="v">${fq(t.qty)} · ${M(t.amt)}</span></div>`).join('') : `<p class="hint">Sin ventas este día.</p>`;

    const el = $('#slist');
    if (!S.salesLoaded) { el.innerHTML = `<div class="empty">Cargando ventas…</div>`; return; }
    if (!S.sales.length) { el.innerHTML = `<div class="empty">No hay ventas registradas este día.</div>`; return; }
    el.innerHTML = S.sales.map((s) => {
      const n = s.items.reduce((a, i) => a + i.qty, 0);
      const desc = s.items.map((i) => `${fq(i.qty)} ${i.name}`).join(', ');
      return `<details class="sale${s.voided ? ' voided' : ''}" data-id="${esc(s.id)}">
        <summary><span class="tm">${timeOf(s.at)}</span><span class="sm" title="${esc(desc)}">${esc(desc)}</span>
          ${s.voided ? '<span class="chip void">Cancelada</span>' : `<span class="chip">${METHODS[s.method] || esc(s.method)}</span>`}
          <span class="st">${M(s.total)}</span></summary>
        <div class="body">
          <pre class="receipt">${esc(ticketText(s))}</pre>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <button type="button" class="btn sm" data-a="copy">Copiar ticket</button>
            ${!s.voided && !S.readOnly ? '<button type="button" class="btn sm danger" data-a="void">Cancelar venta</button>' : ''}
          </div>
          <p class="hint">${fq(n)} ${n === 1 ? 'artículo' : 'artículos'} · Folio ${folio(s)}${s.voided ? ' · Cancelada; la existencia se devolvió al inventario.' : ''}</p>
        </div>
      </details>`;
    }).join('');
  }

  $('#slist').addEventListener('click', async (e) => {
    const b = e.target.closest('button[data-a]'); if (!b) return;
    const s = S.sales.find((x) => x.id === b.closest('.sale').dataset.id); if (!s) return;
    if (b.dataset.a === 'copy') return copy(ticketText(s), 'Ticket copiado');
    if (!b.classList.contains('armed')) {
      b.classList.add('armed'); b.textContent = '¿Cancelar esta venta?';
      setTimeout(() => { if (b.isConnected) { b.classList.remove('armed'); b.textContent = 'Cancelar venta'; } }, 3000);
      return;
    }
    if (await guard(() => api.patchSale(s.id, { voided: true, voidedAt: new Date().toISOString() }))) {
      await adjustStock(s.items, +1);
      toast('Venta cancelada');
    }
  });

  $('#day').addEventListener('change', () => { if (!$('#day').value) return; S.day = $('#day').value; subscribeSales(); });
  $('#todayBtn').addEventListener('click', () => { S.day = dayOf(new Date()); $('#day').value = S.day; subscribeSales(); });

  $('#copyCut').addEventListener('click', () => {
    const valid = S.sales.filter((s) => !s.voided);
    const by = { efectivo: 0, tarjeta: 0, transferencia: 0 };
    valid.forEach((s) => { by[s.method] = r2((by[s.method] || 0) + s.total); });
    const total = r2(valid.reduce((a, s) => a + s.total, 0));
    const d = new Date(S.day + 'T12:00:00');
    const lines = [
      `CORTE DE CAJA · ${(S.settings.name || 'Mi negocio')}`,
      d.toLocaleDateString('es-MX', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }),
      '',
      `Ventas: ${valid.length}${S.sales.length - valid.length ? ` (${S.sales.length - valid.length} canceladas)` : ''}`,
      `Efectivo: ${M(by.efectivo)}`,
      `Tarjeta: ${M(by.tarjeta)}`,
      `Transferencia: ${M(by.transferencia)}`,
      `TOTAL: ${M(total)}`,
    ];
    copy(lines.join('\n'), 'Corte copiado');
  });

  /* ---------- Utilidades ---------- */
  function toast(msg) {
    const t = $('#toast'); t.textContent = msg; t.hidden = false;
    clearTimeout(toast.t); toast.t = setTimeout(() => { t.hidden = true; }, 2400);
  }
  function copy(text, okMsg) {
    const fallback = () => {
      const ta = document.createElement('textarea');
      ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      let ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
      ta.remove(); toast(ok ? okMsg : 'No se pudo copiar. Selecciona el texto del ticket a mano.');
    };
    try { navigator.clipboard.writeText(text).then(() => toast(okMsg), fallback); } catch (e) { fallback(); }
  }

  init();
})();
</script>
